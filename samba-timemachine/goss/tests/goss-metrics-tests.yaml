# Runs with METRICS_FILE set and a volume owned by PUID:PGID mounted at /metrics (./run test, phase 3).
file:
  /etc/samba/smb.conf:
    exists: true
    contents:
    # smbd waits for postexec, and runs it without a shell: only a
    # backgrounded sh -c lets the client disconnect without waiting for the walk
    - '/^ +postexec += /bin/sh -c "/scripts/backup-metrics.sh .* %I .*&"$/'

  # Written once at container start, before any client has connected
  {{.Env.METRICS_FILE}}:
    exists: true
    mode: "0644"
    owner: {{.Env.USER}}
    filetype: file
    contents:
    - "/^timemachine_metrics_success 1$/"
    - "/^timemachine_metrics_last_success_timestamp_seconds [1-9][0-9]+$/"
    - "/^timemachine_bundles 0$/"

command:
  # A run that cannot read the backup directory reports failure, keeps the
  # previous last-success time and writes no bundle values
  metrics_unreadable_backup_dir:
    exec: >-
      out=/metrics/failure-test.prom;
      setpriv --reuid={{.Env.PUID}} --regid={{.Env.PGID}} --clear-groups /scripts/backup-metrics.sh "$out" {{.Env.BACKUPDIR}} &&
      setpriv --reuid={{.Env.PUID}} --regid={{.Env.PGID}} --clear-groups /scripts/backup-metrics.sh "$out" /root;
      echo "exit=$?"; cat "$out"; rm -f "$out"
    exit-status: 0
    stdout:
    - "exit=1"
    - "/^timemachine_metrics_success 0$/"
    - "/^timemachine_metrics_last_success_timestamp_seconds [1-9][0-9]+$/"
    - "!timemachine_bundle"
    timeout: 10000

  # The container's own healthcheck connects over loopback; it must not trigger a rewrite
  metrics_skip_loopback_clients:
    exec: >-
      for ip in 127.0.0.1 ::1 ::ffff:127.0.0.1; do
      setpriv --reuid={{.Env.PUID}} --regid={{.Env.PGID}} --clear-groups /scripts/backup-metrics.sh /metrics/loopback-test.prom {{.Env.BACKUPDIR}} "$ip";
      done; ls /metrics
    exit-status: 0
    stdout:
    - "!loopback-test"
    timeout: 10000
